name: Build ResonX Cross-Platform (iOS & Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pobieranie zaleznosci Flutter
        run: flutter pub get

      - name: Kompilacja APK (Release)
        run: flutter build apk --release

      - name: Zmiana nazwy pliku APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ResonX-Android.apk

      - name: Zapisanie pliku APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: ResonX-Android-APK
          path: ResonX-Android.apk

  build-ios:
    name: Build iOS IPA (macOS Runner)
    runs-on: macos-14
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pobieranie zaleznosci Flutter
        run: flutter pub get

      - name: Instalacja zaleznosci CocoaPods dla iOS
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Kompilacja aplikacji iOS (Release bez certyfikatu)
        run: flutter build ios --release --no-codesign

      - name: Pakowanie Runner.app do archiwum Payload (IPA)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ResonX-iOS.ipa Payload
          rm -rf Payload

      - name: Zapisanie pliku IPA jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: ResonX-iOS-IPA
          path: ResonX-iOS.ipa

  publish-release:
    name: Publish Release to GitHub
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4

      - name: Pobranie artefaktu Android APK
        uses: actions/download-artifact@v4
        with:
          name: ResonX-Android-APK

      - name: Pobranie artefaktu iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ResonX-iOS-IPA

      - name: Utworzenie GitHub Release z plikami APK i IPA
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ResonX-Android.apk
            ResonX-iOS.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}